a.",text:"Se finisci in fretta e senza errori le carte hanno pi\xF9 figure e pi\xF9 piccole; se fai fatica ne hanno meno. Vale la mano, non la gara: perdere contro un adulto non abbassa il livello."},{title:"Dopo un errore.",text:"Dal livello 3 le carte si fermano per un secondo, poi puoi riprovare. Ai primi due livelli non c'\xE8 nessuna attesa."},{title:"Il terzo gradino conta.",text:"Se usi \xABToccala tu\xBB la mano \xE8 \xABcon aiuto\xBB: il livello non cambia, n\xE9 in su n\xE9 in gi\xF9."}],faq:[{q:"Quanti anni servono?",a:"Si pu\xF2 giocare da 3 anni: il primo livello ha solo 3 figure grandi per carta. Un adulto pu\xF2 giocare nello stesso momento al suo livello."},{q:"Come gioco in due?",a:"Scegli \xABIn due\xBB nel menu: ognuno ha la sua met\xE0 dello schermo, con l'et\xE0 e il livello suoi. Si gioca nello stesso tempo."},{q:"Perch\xE9 cambia il livello?",a:"Il gioco guarda tempo, errori e suggerimenti della mano. Se \xE8 troppo facile sale, se \xE8 troppo difficile scende."},{q:"Posso scegliere il livello?",a:"S\xEC: nel menu, per ogni giocatore, puoi lasciarlo automatico oppure fissarlo da 1 a 10."},{q:"Perch\xE9 Lampo a volte \xE8 lento?",a:"Lampo si adatta a te: se vinci spesso diventa pi\xF9 svelto, se perdi troppo rallenta."}]},en:{intro:"Two round cards always share one picture: find it and tap it, as fast as you can.",rules:[{title:"The goal.",text:"In each pair there is the card to beat (top) and your own (bottom). They have exactly one picture in common: tap it."},{title:"Where to tap.",text:"You can tap the picture on either card: if it is the right one, the next pair comes up."},{title:"The hand.",text:"A hand is 8 pairs. Whoever finishes them first wins. Whoever comes second still finishes their own hand."},{title:"Three ways to play.",text:"Against Lampo (the computer), Two players on the same screen, or Practice on your own, without a race."},{title:"Everyone at their own level.",text:"Each player has their own cards, at their own level: a s
