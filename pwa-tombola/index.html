<!doctype html>
<html lang="it" data-version="1.5.7">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tombola Amica</title>
    <meta name="description" content="La tombola in famiglia con un compagno simpatico che ti fa vedere quanto ti manca per l'ambo, il terno e la tombola: nessuna fretta, estrai quando vuoi." />
    <meta name="theme-color" content="#6d3fa0" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <main id="app">
      <section id="menu" class="screen menu"></section>
      <section id="game" class="screen game" hidden>
        <header class="game__bar">
          <button id="exit" class="btn btn--ghost" type="button" aria-label="Menu">&larr;</button>
          <div id="scoreboard" class="scoreboard" aria-live="polite"></div>
          <button class="manual-open" type="button" data-manual></button>
          <button class="usab-open" type="button" data-usability>Aa</button>
          <button id="insightBtn" class="btn btn--accent" type="button">💡</button>
        </header>
        <div class="game__main">
          <div class="game__tablewrap">
            <div id="tablefit" class="tablefit">
              <section id="stage" class="stage"></section>
              <section id="cartelle" class="cartelle"></section>
            </div>
          </div>
          <aside class="game__side">
            <div id="companion" class="bubble" hidden aria-live="polite"></div>
            <p id="status" class="status" aria-live="polite"></p>
            <p id="feedback" class="feedback" aria-live="polite"></p>
            <section id="insight" class="insight" hidden></section>
            <div id="board" class="board"></div>
            <section id="foes" class="foes"></section>
          </aside>
        </div>
      </section>
    </main>
    <dialog id="result" class="result"></dialog>
    <dialog id="usab" class="usab"></dialog>
    <dialog id="manual" class="manual"></dialog>
    <script defer src="js/main.js"></script>
  </body>
</html>
