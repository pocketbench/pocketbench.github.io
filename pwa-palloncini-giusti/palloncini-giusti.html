i, a tre gradini: un consiglio, i palloncini giusti che si illuminano, oppure i giusti che scoppiano da soli."}],attention:[{title:"Il livello si adatta.",text:"Se la mano va bene i palloncini diventano pi\xF9 veloci, pi\xF9 numerosi e pi\xF9 piccoli, e la regola pi\xF9 difficile (prima il colore, poi il disegno, poi tutti e due); se \xE8 faticosa, si alleggeriscono. Il tempo non conta: contano i palloncini giusti scoppiati e gli errori."},{title:"Il terzo gradino conta.",text:"Se fai scoppiare i giusti da soli la mano \xE8 \xABcon aiuto\xBB: il livello non cambia, n\xE9 in su n\xE9 in gi\xF9."},{title:"Il disegno sul palloncino.",text:"Ai livelli con le forme, il disegno bianco (stella, cuore, triangolo, quadrato, rombo) conta pi\xF9 del colore. Nella modalit\xE0 daltonici ogni colore ha anche un segno dentro il palloncino."}],faq:[{q:"Quanti anni servono?",a:"Si pu\xF2 giocare da 3 anni: al primo livello ci sono due colori, pochi palloncini e vanno piano. Un adulto pu\xF2 giocare al suo livello, a turno."},{q:"Posso mettere in pausa?",a:"S\xEC: premi \xABMenu\xBB e poi \xABContinua la partita\xBB per riprendere da dove eri. Anche se esci o cambi scheda, il tempo in secondo piano non conta."},{q:"Perch\xE9 cambia il livello?",a:"Il gioco guarda quanti giusti hai scoppiato, gli errori e i suggerimenti della mano. Se \xE8 troppo facile sale, se \xE8 troppo difficile scende."},{q:"Posso scegliere il livello?",a:"S\xEC: nel menu, per ogni giocatore, puoi lasciarlo automatico oppure fissarlo da 1 a 10."},{q:"Come mi faccio guidare nel primo giro?",a:"Scegli \xABPrima volta: guidami\xBB nel menu, oppure tocca l\u2019icona \xABGuida prima partita\xBB in alto a partita iniziata. La guida ferma il gioco e ti spiega tutto in schede grandi: i palloncini partono quando premi il pulsante. Se sbagli il gioco si ferma e ti ricorda cosa cercare; \xABStop apprendimento\xBB chiude la guida."}]},en:{intro:"Balloons float upwards: tap only the right ones, following the rule at the top of the screen, and let the others fly.",rules:[{title:"The goal.",text:"Pop all the right balloons. The hand ends when every balloon has popped or floated away."},{title:"The rule.",text:"At the top there is a sample balloon with its name: it says whether the colour, the picture or both together count. Tap only the balloons that match the sample."},{title:"A wrong balloon.",text:"If you tap it, it just dances a little: there is no penalty. It only counts as a mistake for the level."},{title:"A right one that escapes.",text:"If a right balloon reaches the top without being tapped, it floats away: never mind, here comes the next one."},{title:"Two ways to play.",text:"On your own, or two players in turns on the same device: first one plays, then the other, each with their own age and level."},{title:"Hints.",text:"They are always available, with no limit, in three steps: a tip, the right balloons lighting up, or the right ones popping by themselves."}],attention:[{title:"The level adapts.",text:"If the hand goes well the balloons get faster, more numerous and smaller, and the rule harder (first colour, then picture, then both); if it is hard, they get lighter. Time does not count: what counts are the right balloons popped and the mistakes."},{title:"The third step counts.",text:"If you let the right ones pop by themselves, the hand is \xABwith help\xBB: the level does not change, up or down."},{title:"The picture on the balloon.",text:"On levels with shapes, the white picture (star, heart, triangle, square, diamond) counts more than the colour. In colour-blind mode every colour also has a mark inside the balloon."}],faq:[{q:"How old do you need to be?",a:"You can play from age 3: on the first level there are two colours, few balloons and they go slowly. A grown-up can play at their own level, in turns."},{q:"Can I pause?",a:"Yes: press \xABMenu\xBB and then \xABResume the game\xBB to carry on from where you were. Even if you leave or switch tabs, the time in the background does not count."},{q:"Why does the level change?",a:"The game looks at how many right balloons you popped, the mistakes and the hints of the hand. If it is too easy it goes up, if it is too hard it goes down."},{q:"Can I choose the level?",a:"Yes: in the menu, for each player, you can leave it automatic or fix it from 1 to 10."},{q:"How do I get guided through my first round?",a:"Choose \u201CFirst time: guide me\u201D in the menu, or tap the \u201CFirst-game guide\u201D icon at the top. The guide pauses the game and explains everything on big cards: the balloons start when you press the button. If you tap a wrong one the game pauses and reminds you what to look for; \u201CStop learning\u201D closes the guide."}]}};var d=s=>document.getElementById(s),At=class{#t=d("menu");#e=d("game");constructor(){this.prefs=new Ot,this.i18n=new Rt(this.prefs.get("lang",yt(globalThis.navigator?.language))),this.humor=new U(this.prefs.getJSON("humor",{})),this.companion=new F(this.i18n.say,this.humor,ae),this.usab=new R({store:{load:()=>this.prefs.getJSON("usability",{}),save:e=>this.prefs.setJSON("usability",e)}}),new B(d("usab"),this.usab,()=>this.i18n.ui.usab),this.sidePanel=new z({host:document.querySelector(".game__side"),hide:["#companion","#hint","#feedback"],opener:d("hintBtn"),usab:this.usab,labels:()=>this.i18n.ui.usab}),this.manual=new D(d("manual"),de,()=>this.i18n.lang),this.pause=new O,this.tour=new N(d("tour"),{pause:this.pause,labels:()=>A[this.i18n.lang],onRequest:()=>this.game.startTour(),onChange:(e,i)=>{!e&&(i==="done"||i==="stop")&&this.prefs.set("guided",!1)}}),new V({root:d("game"),selector:".balloon",enabled:()=>this.usab.zoom});let t=new j({box:document.querySelector(".game__tablewrap"),content:d("table"),prop:"--cell",min:60,max:420,scale:()=>this.usab.scale});this.usab.onChange(()=>t.refit()),this.companionView=new q(d("companion"),e=>this.#r(e),re),this.companionView.t=this.i18n,this.game=new ot({els:{table:d("table"),track:d("track"),hint:d("hint"
