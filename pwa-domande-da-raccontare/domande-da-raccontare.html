a quattro persone, sullo stesso dispositivo. Si passano il dispositivo o lo appoggiano al centro."},{q:"Quanti anni servono?",a:"Dai 3 anni: ai pi\xF9 piccoli toccano domande semplici (colori, animali, giochi). Un adulto pu\xF2 aiutare a leggere la carta."},{q:"Come finisce?",a:"Non finisce da sola: si smette quando si vuole, premendo \xABSmetti\xBB. Il gioco dice quante carte avete letto, senza punteggio."},{q:"Le domande sono sempre le stesse?",a:"Le carte si mescolano a ogni partita, e dipendono dalle et\xE0 e da quanto volete raccontare."},{q:"Come mi faccio guidare nel primo giro?",a:"Scegli \xABPrima volta: guidami\xBB nel menu, oppure tocca l\u2019icona \xABGuida prima partita\xBB in alto a partita iniziata. La guida ti dice cosa fare e aspetta che lo faccia tu; puoi saltare un passo o chiuderla quando vuoi."}]},en:{intro:"A card with a question, one person who tells and the others who listen. There are no points: you just chat together.",rules:[{title:"How to play.",text:"At every turn a card with a question appears. Whoever has the turn answers out loud and tells whatever they like; the others listen."},{title:"Whoever listens.",text:"Can ask one more question, like the one written under the card (\xABAnd then what happened?\xBB). Tellers love it."},{title:"I am done.",text:"When you have finished telling, press \xABI am done\xBB: it is the next person's turn, with a new card."},{title:"Pass.",text:"If you do not like a card, press \xABPass\xBB: another card comes, no problem at all. Passing is always fine."},{title:"An idea to start.",text:"If you do not know where to begin, press \xABAn idea to start\xBB: the beginning of a sentence to finish appears."}],attention:[{title:"Ages.",text:"At the start you say how many people are playing (2 to 4) and how old each one is. The cards are chosen so that even the youngest can answer."},{title:"How much to share.",text:"You can choose light things (games, food, animals), also more personal (memories, loved ones) or also the most personal (dreams, what matters). You can change it any time by going back to the menu."},{title:"No answer is saved.",text:"The game does not listen and records nothing: it does not use the microphone and it is not connected to the internet. It only saves which card you reached."},{title:"You can say \xABI would rather not\xBB.",text:"Nobody has to answer. The questions are not about illness, loss, money or painful events, but if a card does not suit someone, you pass."}],faq:[{q:"Can we play with two?",a:"Yes: from two to four people, on the same device. Pass it around or put it in the middle."},{q:"How old do you need to be?",a:"From age 3: the youngest get simple questions (colours, animals, games). A grown-up can help read the card."},{q:"How does it end?",a:"It does not end by itself: you stop when you like, pressing \xABStop\xBB. The game says how many cards you read, with no score."},{q:"Are the questions always the same?",a:"The cards are shuffled in every game, and depend on the ages and on how much you want to share."},{q:"How do I get guided through my first round?",a:"Choose \u201CFirst time: guide me\u201D in the menu, or tap the \u201CFirst-game guide\u201D icon at the top once the game has started. The guide tells you what to do and waits for you to do it; you can skip a step or close it any time."}]}};var c=s=>document.getElementById(s),at=class{#t=c("menu");#e=c("game");constructor(){this.prefs=new nt,this.i18n=new vt(this.prefs.get("lang",X(globalThis.navigator?.language))),this.humor=new M(this.prefs.getJSON("humor",{})),this.companion=new q(this.i18n.say,this.humor,At),this.usab=new T({store:{load:()=>this.prefs.getJSON("usability",{}),save:t=>this.prefs.setJSON("usability",t)}}),new E(c("usab"),this.usab,()=>this.i18n.ui.usab),this.sidePanel=new S({host:document.querySelector(".game__side"),hide:["#companion","#hint","#feedback"],opener:c("hintBtn"),usab:this.usab,labels:()=>this.i18n.ui.usab}),this.manual=new C(c("manual"),Et,()=
