  <body>
    <main id="app">
      <section id="menu" class="screen menu"></section>
      <section id="game" class="screen game" hidden>
        <header class="game__bar">
          <button id="exit" class="btn btn--ghost" type="button" aria-label="Menu">&larr;</button>
          <div id="scoreboard" class="scoreboard"></div>
          <button class="manual-open" type="button" data-manual></button>
          <button class="usab-open" type="button" data-usability>Aa</button>
          <button id="hintBtn" class="btn btn--accent" type="button"></button>
        </header>
        <div class="game__main">
          <div class="game__boardwrap"><div id="board" class="board" role="group"></div></div>
          <aside class="game__side">
            <div id="tray" class="tray" role="group"></div>
            <p id="status" class="status" aria-live="polite"></p>
            <p id="feedback" class="feedback" aria-live="polite"></p>
            <section id="hint" class="advice" hidden aria-live="polite"></section>
            <div id="companion" class="bubble" hidden aria-live="polite"></div>
            <div class="side__row">
              <div id="model" class="model"></div>
              <button id="giveUp" class="btn btn--ghost giveup" type="button"></button>
            </div>
          </aside>
        </div>
      </section>
    </main>
    <dialog id="result" class="result"></dialog>
    <dialog id="modelPic" class="modelpic"></dialog>

 levels.",text:"From 4 to 80 blocks, with pictures richer and richer in detail. The game starts from the age you choose and then adapts by itself."},{title:"Help.",text:'The "Help" button is always there, without limits, in three steps: a tip, the place, the block.'}],attention:[{title:"The level adapts.",text:"If you finish quickly and without mistakes the mosaics get bigger; if it is hard they get smaller. It is not a race."},{title:"The third step counts.",text:'If you reach the third step of help or use "Place it for me", the mosaic is "with help" and does not change the level.'},{title:"The clock stops.",text:"If you do not touch the screen for a while, the time stops counting: you can take a break."}],faq:[{q:"How old do you need to be?",a:"You can play from age 3: the first level has only 4 big blocks. A grown-up can help by tapping the blocks together with the child."},{q:"Why does the level change?",a:"The game looks at time, mistakes and help in the mosaics you finish. If it is too easy it goes up, if it is too hard it goes down."},{q:"Several children on the same device?",a:"Change the age in the menu: the game restarts from the right level for that age."},{q:"Can I choose a fixed level?",a:"Yes, in the menu: then the level never changes and the mosaics do not count for the adaptation."},{q:"Can I give up?",a:'Yes: "Show the mosaic" completes the picture. The next mosaic will be a little lighter.'},{q:"The companion's jokes bother me.",a:"Give a joke a thumbs down: they fade away until they disappear. You can also turn the companion off in the menu."}]}};var u=i=>document.getElementById(i),Lt=class{#t=u("menu");#e=u("game");constructor(){this.prefs=new Et,this.i18n=new Q(this.prefs.get("lang",vt(globalThis.navigator?.language))),this.humor=new F(this.prefs.getJSON("humor",{})),this.companion=new O(this.i18n.say,this.humor,le),this.usab=new N({store:{load:()=>this.prefs.getJSON("usability",{}),save:t=>this.prefs.setJSON("usability",t)}}),new I(u("usab"),th
