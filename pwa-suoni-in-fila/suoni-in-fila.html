tion:[{title:"Il livello si adatta.",text:"Se la mano va in fretta e senza errori i tasti aumentano e le sequenze si allungano; se \xE8 faticosa, si alleggeriscono. Il tempo conta solo da quando la sequenza ha finito di suonare."},{title:"Dal livello 8 si ascolta una volta sola.",text:"Dopo il primo ascolto, riascoltare la sequenza \xE8 un suggerimento: puoi farlo quando vuoi, ma conta come aiuto. Se sbagli, invece, si riascolta da sola senza costo."},{title:"Il terzo gradino conta.",text:"Se fai lampeggiare il prossimo tasto la mano \xE8 \xABcon aiuto\xBB: il livello non cambia, n\xE9 in su n\xE9 in gi\xF9."},{title:"Il suono.",text:"Si accende e si spegne dall'icona dell'altoparlante. Su alcuni dispositivi il suono parte solo dopo il primo tocco."}],faq:[{q:"Quanti anni servono?",a:"Si pu\xF2 giocare da 3 anni: al primo livello ci sono due tasti e la sequenza arriva a tre note. Un adulto pu\xF2 giocare nello stesso momento al suo livello, a turno."},{q:"Posso giocare senza suono?",a:"S\xEC: i tasti si accendono uno alla volta nell'ordine giusto. Spegni il suono dal menu o dall'icona dell'altoparlante."},{q:"Come ricordo meglio la sequenza?",a:"Canticchiala a voce, raggruppa le note a due a due oppure di' il nome delle forme: sono i consigli del gioco."},{q:"Perch\xE9 cambia il livello?",a:"Il gioco guarda tempo, errori e suggerimenti della mano. Se \xE8 troppo facile sale, se \xE8 troppo difficile scende."},{q:"Posso scegliere il livello?",a:"S\xEC: nel menu, per ogni giocatore, puoi lasciarlo automatico oppure fissarlo da 1 a 10."},{q:"Come mi faccio guidare nel primo giro?",a:"Scegli \xABPrima volta: guidami\xBB nel menu, oppure tocca l\u2019icona \xABGuida prima partita\xBB in alto a partita iniziata. La guida ti dice cosa fare e aspetta che lo faccia tu; puoi saltare un passo o chiuderla quando vuoi."}]},en:{intro:"The game plays one note, then two, then three\u2026: listen to the sequence and repeat it by tapping the keys in the same order.",rules:[{title:"The goal.",text:"Repeat the sequence of notes. Each time you repeat it right, it gets one note longer, up to the length of your level."},{title:"The keys.",text:"Every key has a note, a colour and a shape. While the game plays, the keys light up: you can play even without hearing."},{title:"A wrong key.",text:"The sequence plays again by itself and you start repeating it again. There is no penalty and no ticking clock, but mistakes count for the level."},{title:"Two ways to play.",text:"With the computer, which plays the sequence, or two players in turns on the same device: first one plays, then the other, each with their own age and level."},{title:"Hints.",text:"They are always available, with no limit, in three steps: a tip, a slow replay, or the next key flashing."}],attention:[{title:"The level adapts.",text:"If the hand goes quickly and with no mistakes, the keys increase and the sequences get longer; if it is hard, they get lighter. Time only counts from when the sequence has finished playing."},{title:"From level 8 you listen once.",text:"After the first listen, replaying the sequence is a hint: you can do it whenever you like, but it counts as help. If you make a mistake, instead, it replays by itself at no cost."},{title:"The third step counts.",text:"If you make the next key flash, the hand is \xABwith help\xBB: the level does not change, up or down."},{title:"The sound.",text:"It turns on and off from the speaker icon. On some devices the sound only starts after the first tap."}],faq:[{q:"How old do you need to be?",a:"You can play from age 3: on the first level there are two keys and the sequence reaches three notes. A grown-up can play at the same time at their own level, in turns."},{q:"Can I play without sound?",a:"Yes: the keys light up one at a time in the right order. Turn the sound off from the menu or from the speaker icon."},{q:"How do I remember the sequence better?",a:"Hum it out loud, group the notes in twos or say the names of the shapes: those are the game's tips."},{q:"Why does the level change?",a:"The game looks at time, mistakes and hints of the hand. If it is too easy it goes up, if it is too hard it goes down."},{q:"Can I choose the level?",a:"Yes: in the menu, for each player, you can leave it automatic or fix it from 1 to 10."},{q:"How do I get guided through my first round?",a:"Choose \u201CFirst time: guide me\u201D in the menu, or tap the \u201CFirst-game guide\u201D icon at the top once the game has started. The guide tells you what to do and waits for you to do it; you can skip a step or close it any time."}]}};var d=s=>document.getElementById(s),$t=class{#t=d("menu");#e=d("game");constructor(){this.prefs=new _t,this.i18n=new qt(this.prefs.get("lang",pt(globalThis.navigator?.language))),this.humor=new C(this.prefs.getJSON("humor",{})),this.companion=new q(this.i18n.say,this.humor,Xt),this.usab=new N({store:{load:()=>this.prefs.getJSON("usability",{}),save:e=>this.prefs.setJSON("usability",e)}}),new P(d("usab"),this.usab,()=>this.i18n.ui.usab),this.sidePanel=new O({host:document.querySelector(".game__side"),hide:["#companion","#hint","#feedback"],opener:d("hintBtn"),usab:this.usab,labels:()=>this.i18n.ui.usab}),this.manual=new F(d("manual"),ie,()=>this.i18n.lang),this.tour=new H(d("tour"),{labels:()=>T[this.i18n.lang],onRequest:()=>this.game.startTour(),onChange:(e,i)=>{!e&&(i==="done"||i==="stop")&&this.prefs.set("guided",!1)}}),new D({root:d("game"),selector:".pad",enabled:()=>this.usab.zoom});let t=new U({box:document.querySelector(".game__tablewrap"),content:d("table"),prop:"--cell",min:40,max:170,scale:()=>this.usab.scale});this.usab.onChange(()=>t.refit()),this.companionView=new z(d("companion"),e=>this.#l(e),Qt),this.companionView.t=this.i18n,this.game=new X({els:{table:d("table"),track:d("track"),hint:d("hint"),hintBtn:d("hintBtn"),giveUp:d("giveUp"),exit:d("exit"),mute:d("mute"),status:d("status"),feedback:d("feedback")},i18n:this.i18n,humor:this.humor,companion:this.companion,comp
