numeri scritti sulle carte."}],attention:[{title:"Il livello si adatta.",text:"Se la mano va in fretta e senza errori i gruppi diventano pi\xF9 grandi e pi\xF9 vicini tra loro; se \xE8 faticosa, si alleggeriscono. Conta la mano, non la gara: perdere contro il computer non abbassa il livello."},{title:"Una carta sbagliata.",text:"Si spegne e conta come errore: resta l'altra. Non c'\xE8 nessuna attesa e nessuna penalit\xE0, ma gli errori contano per il livello."},{title:"Dal livello 7 gli oggetti spariscono.",text:"Dopo qualche secondo le carte si coprono con un punto interrogativo: \xE8 una prova di stima rapida. I suggerimenti li fanno rivedere."},{title:"Il terzo gradino conta.",text:"Se fai scrivere i numeri sulle carte la mano \xE8 \xABcon aiuto\xBB: il livello non cambia, n\xE9 in su n\xE9 in gi\xF9."}],faq:[{q:"Quanti anni servono?",a:"Si pu\xF2 giocare da 3 anni: al primo livello ci sono da 1 a 5 oggetti e una carta ne ha molti pi\xF9 dell'altra. Un adulto pu\xF2 giocare nello stesso momento al suo livello, a turno."},{q:"Devo saper contare?",a:"No: i piccoli possono guardare quale carta \xE8 \xABpi\xF9 piena\xBB o abbinare gli oggetti uno a uno. Ai livelli alti si impara a stimare a colpo d'occhio."},{q:"Perch\xE9 cambia il livello?",a:"Il gioco guarda tempo, errori e suggerimenti della mano. Se \xE8 troppo facile sale, se \xE8 troppo difficile scende."},{q:"Posso scegliere il livello?",a:"S\xEC: nel menu, per ogni giocatore, puoi lasciarlo automatico oppure fissarlo da 1 a 10."},{q:"Perch\xE9 il computer a volte vince?",a:"Il computer va al passo del livello: se rispondi nei tempi giusti vinci di poco, se sei molto veloce vinci bene."},{q:"Come mi faccio guidare nel primo giro?",a:"Scegli \xABPrima volta: guidami\xBB nel menu, oppure tocca l\u2019icona \xABGuida prima partita\xBB in alto a partita iniziata. La guida ti dice cosa fare e aspetta che lo faccia tu; puoi saltare un passo o chiuderla quando vuoi."}]},en:{intro:"Two cards have groups of objects: tap the card with more objects, or fewer, depending on the question.",rules:[{title:"The goal.",text:"Answer all the questions of the hand, one after the other. In every question there are two cards with objects of the same kind."},{title:"More or fewer.",text:"The line above the cards says whether to look for the card with MORE objects or with FEWER objects. From level 3 the question can be either."},{title:"Size does not count.",text:"Objects come in different sizes: a card with a few big objects can look fuller. What counts is how many there are, not how much room they take."},{title:"Three ways to play.",text:"Against the computer (who answers all the questions first), on your own with no race, or two players in turns on the same device, each at their own level."},{title:"Hints.",text:"They are always available, with no limit, in three steps: a tip, the objects paired up (the extra ones are ringed), or the numbers written on the cards."}],attention:[{title:"The level adapts.",text:"If the hand goes quickly and with no mistakes the groups get bigger and closer to each other; if it is hard, they get lighter. What counts is the hand, not the race: losing to the computer does not lower the level."},{title:"A wrong card.",text:"It switches off and counts as a mistake: the other one is left. There is no wait and no penalty, but mistakes count for the level."},{title:"From level 7 the objects disappear.",text:"After a few seconds the cards are covered with a question mark: it is a quick-estimate test. The hints let you see them again."},{title:"The third step counts.",text:"If you have the numbers written on the cards, the hand is \xABwith help\xBB: the level does not change, up or down."}],faq:[{q:"How old do you need to be?",a:"You can play from age 3: on the first level there are 1 to 5 objects and one card has many more than the other. A grown-up can play at the same time at their own level, in turns."},{q:"Do I need to know how to count?",a:"No: little ones can look at which card is \xABfuller\xBB or pair the objects one by one. On the high levels you learn to estimate at a glance."},{q:"Why does the level change?",a:"The game looks at time, mistakes and hints of the hand. If it is too easy it goes up, if it is too hard it goes down."},{q:"Can I choose the level?",a:"Yes: in the menu, for each player, you can leave it automatic or fix it from 1 to 10."},{q:"Why does the computer sometimes win?",a:"The computer goes at the pace of the level: if you answer in the right time you win by a little, if you are very quick you win by a lot."},{q:"How do I get guided through my first round?",a:"Choose \u201CFirst time: guide me\u201D in the menu, or tap the \u201CFirst-game guide\u201D icon at the top once the game has started. The guide tells you what to do and waits for you to do it; you can skip a step or close it any time."}]}};var d=i=>document.getElementById(i),Mt=class{#t=d("menu");#e=d("game");constructor(){this.prefs=new Lt,this.i18n=new It(this.prefs.get("lang",ft(globalThis.navigator?.language))),this.humor=new q(this.prefs.getJSON("humor",{})),this.companion=new P(this.i18n.say,this.humor,oe),this.usab=new z({store:{load:()=>this.prefs.getJSON("usability",{}),save:e=>this.prefs.setJSON("usability",e)}}),new j(d("usab"),this.usab,()=>this.i18n.ui.usab),this.sidePanel=new N({host:document.querySelector(".game__side"),hide:["#companion","#hint","#feedback"],opener:d("hintBtn"),usab:this.usab,labels:()=>this.i18n.ui.usab}),this.manual=new D(d("manual"),ce,()=>this.i18n.lang),this.tour=new O(d("tour"),{labels:()=>A[this.i18n.lang],onRequest:()=>this.game.startTour(),onChange:(e,s)=>{!e&&(s==="done"||s==="stop")&&this.prefs.set("guided",!1)}}),new G({root:d("game"),selector:".card",enabled:()=>this.usab.zoom});let t=new U({box:document.querySelector(".game__tablewrap"),content:d("table"),prop:"--cell",min:70,max:260,scale:()=>this.usab.scale});this.usab.onChange(()=>t.refit()),this.companionView=new I(d("companion"),e=>this.#r(e),
