ca per primo e apre la mano successiva. Finito il mazzo si giocano le ultime tre carte."}],attention:[{title:"Il carico.",text:"Asso e 3 sono i \xABcarichi\xBB: valgono molto. Non aprire con un carico se l'avversario pu\xF2 batterlo con una briscola."},{title:"Non regalare punti.",text:"Se non puoi prendere, scarta un liscio: cos\xEC non perdi nulla."},{title:"Conta le carte.",text:"Le briscole e i carichi usciti non tornano: guarda il pannello \xABConta le carte\xBB per sapere cosa pu\xF2 ancora avere l'avversario."},{title:"Tocca due volte.",text:"Per giocare una carta toccala una prima volta per sceglierla e una seconda volta per confermarla."}],faq:[{q:"Vince chi ha pi\xF9 carte?",a:"No: conta la somma dei punti delle carte prese, non il numero."},{q:"Come si sa chi ha preso la mano?",a:"Il gioco lo dice a ogni mano e aggiorna i punti."},{q:"Il computer vede le mie carte?",a:"No: ragiona solo sulle carte che ha visto e sulle probabilit\xE0. Il mazzo non viene mai truccato."},{q:"Posso chiedere un consiglio?",a:"S\xEC, quando vuoi e senza limiti: il gioco ordina le carte dalla migliore e spiega il motivo."},{q:"Le battute del compagno mi disturbano.",a:"Dai un pollice in gi\xF9 a una battuta: diminuiscono fino a sparire. Puoi anche togliere il compagno dal menu."}]},en:{intro:"Two people play with the Italian 40-card deck, three cards each.",rules:[{title:"The goal.",text:"The first to get more than 60 points from the cards they take wins. At 60 each it is a draw. There are 120 points in all."},{title:"The trump.",text:"The card turned up after dealing sets the trump suit and stays under the deck. Trumps beat every card of the other suits."},{title:"A trick.",text:"The leader plays a card and the other player answers with any card: you do not have to follow suit."},{title:"Who takes it.",text:"The highest trump takes the trick; with no trumps, the highest card of the suit led. If the second card is neither a trump nor of the suit led, the leader takes it."},{titl
