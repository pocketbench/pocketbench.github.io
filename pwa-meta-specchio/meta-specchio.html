o senza gara, oppure in due a turno sullo stesso dispositivo, ognuno con le sue figure e il suo livello."},{title:"I suggerimenti.",text:"Sono sempre disponibili, senza limiti, a tre gradini: un consiglio, la riga dove c'\xE8 la prossima casella, oppure la casella e il colore giusti."}],attention:[{title:"Il livello si adatta.",text:"Se la mano va in fretta e con pochi errori le figure diventano pi\xF9 grandi, con pi\xF9 colori e con lo specchio anche in orizzontale e in diagonale; se \xE8 faticosa, si alleggeriscono. Conta la mano, non la gara."},{title:"Un colore sbagliato.",text:"Lampeggia e sparisce: riprova. Non c'\xE8 nessuna attesa e nessuna penalit\xE0, ma gli errori contano per il livello."},{title:"Il terzo gradino conta.",text:"Se fai mostrare la casella e il colore giusti la mano \xE8 \xABcon aiuto\xBB: il livello non cambia, n\xE9 in su n\xE9 in gi\xF9."},{title:"I segni dei colori.",text:"Nella modalit\xE0 daltonici ogni colore ha anche un segno dentro la casella (punto, barra, croce, anello, zigzag)."}],faq:[{q:"Quanti anni servono?",a:"Si pu\xF2 giocare da 3 anni: al primo livello la figura \xE8 di 2\xD72 caselle e basta copiare due caselle. Un adulto pu\xF2 giocare nello stesso momento al suo livello, a turno."},{q:"Come trovo la casella giusta?",a:"Immagina di piegare la figura sulla linea tratteggiata: ogni casella cade sulla sua gemella. Oppure fai una riga alla volta, dalla linea verso il bordo."},{q:"Perch\xE9 cambia il livello?",a:"Il gioco guarda tempo, errori e suggerimenti della mano. Se \xE8 troppo facile sale, se \xE8 troppo difficile scende."},{q:"Posso scegliere il livello?",a:"S\xEC: nel menu, per ogni giocatore, puoi lasciarlo automatico oppure fissarlo da 1 a 10."},{q:"Perch\xE9 il computer a volte vince?",a:"Il computer va al passo del livello: se finisci nei tempi giusti vinci di poco, se sei molto veloce vinci bene."},{q:"Come mi faccio guidare nel primo giro?",a:"Scegli \xABPrima volta: guidami\xBB nel menu, oppure tocca l\u2019i side the square (dot, bar, cross, ring, zigzag)."}],faq:[{q:"How old do you need to be?",a:"You can play from age 3: on the first level the figure is 2\xD72 squares and you only copy two squares. A grown-up can play at the same time at their own level, in turns."},{q:"How do I find the right square?",a:"Imagine folding the figure on the dashed line: every square lands on its twin. Or do one row at a time, from the line towards the edge."},{q:"Why does the level change?",a:"The game looks at time, mistakes and hints of the hand. If it is too easy it goes up, if it is too hard it goes down."},{q:"Can I choose the level?",a:"Yes: in the menu, for each player, you can leave it automatic or fix it from 1 to 10."},{q:"Why does the computer sometimes win?",a:"The computer goes at the pace of the level: if you finish in the right time you win by a little, if you are very quick you win by a lot."},{q:"How do I get guided through my first round?",a:"Choose \u201CFirst time: guide me\u201D in the menu, or tap the \u201CFirst-game guide\u201D icon at the top once the game has started. The guide tells you what to do and waits for you to do it; you can skip a step or close it any time."}]}};var f=s=>document.getElementById(s),Lt=class{#t=f("menu");#e=f("game");constructor(){this.prefs=new Tt,this.i18n=new Pt(this.prefs.get("lang",yt(globalThis.navigator?.language))),this.humor=new z(this.prefs.getJSON("humor",{})),this.companion=new N(this.i18n.say,this.humor,se),this.usab=new I({store:{load:()=>this.prefs.getJSON("usability",{}),save:e=>this.prefs.setJSON("usability",e)}}),new P(f("usab"),this.usab,()=>this.i18n.ui.usab),this.sidePanel=new C({host:document.querySelector(".game__side"),hide:["#companion","#hint","#feedback"],opener:f("hintBtn"),usab:this.usab,labels:()=>this.i18n.ui.usab}),this.manual=new U(f("manual"),he,()=>this.i18n.lang),this.tour=new H(f("tour"),{labels:()=>T[this.i18n.lang],onRequest:()=>this.game.startTour(),onChange:(e,i)=>{!e&&(i==="done"||i==="stop")&&t
