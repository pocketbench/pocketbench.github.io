ntion:[{title:"Il livello si adatta.",text:"Se la griglia va in fretta e senza errori diventa pi\xF9 grande, con pi\xF9 parole e con file anche al contrario o in diagonale; se \xE8 faticosa, si alleggerisce. Conta la mano, non la gara: perdere contro il computer non abbassa il livello."},{title:"Una fila sbagliata.",text:"Si scuote e basta: riprova. Non c'\xE8 nessuna attesa e nessuna penalit\xE0, ma gli errori contano per il livello."},{title:"Le parole possono essere al contrario.",text:"Dal livello 5 una parola pu\xF2 essere scritta da destra a sinistra o dal basso in alto. Si indica nello stesso modo, partendo da una qualsiasi delle due estremit\xE0."},{title:"Il terzo gradino conta.",text:"Se fai lampeggiare la prima lettera la mano \xE8 \xABcon aiuto\xBB: il livello non cambia, n\xE9 in su n\xE9 in gi\xF9."},{title:"La lingua.",text:"Le parole sono nella lingua dell'app: italiano o inglese, scelta nel menu."}],faq:[{q:"Quanti anni servono?",a:"Serve saper leggere: si pu\xF2 cominciare verso i 6 anni con griglie piccolissime e due parole. Un adulto pu\xF2 giocare nello stesso momento al suo livello, a turno."},{q:"Posso giocare da solo?",a:"S\xEC: scegli \xABDa solo\xBB (senza gara) oppure \xABContro il computer\xBB."},{q:"Come cerco meglio le parole?",a:"Cerca prima le lettere meno comuni, scorri una riga alla volta con lo sguardo, oppure leggi la parola a voce e cerca la sua prima lettera: sono i consigli del gioco."},{q:"Perch\xE9 cambia il livello?",a:"Il gioco guarda tempo, errori e suggerimenti della mano. Se \xE8 troppo facile sale, se \xE8 troppo difficile scende."},{q:"Posso scegliere il livello?",a:"S\xEC: nel menu, per ogni giocatore, puoi lasciarlo automatico oppure fissarlo da 1 a 10."},{q:"Come mi faccio guidare nel primo giro?",a:"Scegli \xABPrima volta: guidami\xBB nel menu, oppure tocca l\u2019icona \xABGuida prima partita\xBB in alto a partita iniziata. La guida ti dice cosa fare e aspetta che lo faccia tu; puoi saltare un passo o chiuderla quando vuoi."}]},en:{intro:"Words are hidden in a grid of letters: find them all by marking the row of letters that spells each one.",rules:[{title:"The goal.",text:"Find all the hidden words. Words are in a straight row: across, down or diagonal."},{title:"How to mark a word.",text:"Drag your finger from the first to the last letter, or tap the first letter and then the last one. A found word is coloured and stays underlined."},{title:"The list.",text:"On the first levels you see the words to look for; then you only see how many there are and how many letters each has; on the high levels you only see a clue for each word."},{title:"Three ways to play.",text:"Against the computer (who finds all the words first), on your own with no race, or two players in turns on the same device, each with their own grid and level."},{title:"Hints.",text:"They are always available, with no limit, in three steps: a tip, an area to look in, or the first letter of a word."}],attention:[{title:"The level adapts.",text:"If the grid goes quickly and with no mistakes it gets bigger, with more words and rows that can run backwards or diagonally; if it is hard, it gets lighter. What counts is the hand, not the race: losing to the computer does not lower the level."},{title:"A wrong row.",text:"It just shakes: try again. There is no wait and no penalty, but mistakes count for the level."},{title:"Words can be backwards.",text:"From level 5 a word can be written right to left or bottom to top. You mark it the same way, starting from either end."},{title:"The third step counts.",text:"If you make the first letter flash, the hand is \xABwith help\xBB: the level does not change, up or down."},{title:"The language.",text:"The words are in the language of the app: Italian or English, chosen in the menu."}],faq:[{q:"How old do you need to be?",a:"You need to be able to read: you can start around age 6 with tiny grids and two words. A grown-up can play at the same time at their own level, in turns."},
