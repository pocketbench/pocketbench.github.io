 si ferma: puoi saltarla."},{title:"Scappa dal pericolo.",text:"Una pedina a pochi passi davanti a un avversario rischia di essere mangiata: il gioco ti dice con quale probabilit\xE0."},{title:"Il numero giusto.",text:"Vicino a casa il dado deve dare esattamente i passi che servono: tira finch\xE9 esce."}],faq:[{q:"Come si gioca in due sullo stesso dispositivo?",a:"Nel menu scegli \xABIn due\xBB: il Giocatore 1 e il Giocatore 2 si alternano sullo stesso schermo, a turno tirano il dado e toccano la pedina da muovere. Gli altri posti, se ce ne sono, li gioca il computer. Senza consigli n\xE9 livello."},{q:"Perch\xE9 non posso muovere una pedina?",a:"Forse \xE8 ancora nella base (serve un 6), oppure il numero del dado supera l'ultima casella o la porterebbe su una tua pedina."},{q:"Come scelgo la pedina?",a:"Tocca una delle pedine evidenziate: sono quelle che si possono muovere."},{q:"Come funzionano i consigli?",a:"A ogni tiro il gioco ordina le mosse dalla migliore e spiega il motivo (arrivi a casa, catturi, esci dalla base, scappi da un pericolo)."},{q:"Il computer bara?",a:"No: il dado \xE8 casuale e uguale per tutti. Il computer sale di livello solo quanto serve a farti migliorare."},{q:"Come riconosco le squadre?",a:"Dalla forma della pedina oltre che dal colore."},{q:"\xC8 la mia prima volta: come mi aiuta il gioco?",a:"Nel menu accendi \xABPrima volta: guidami\xBB. Dopo il tiro, se puoi muovere pi\xF9 pedine, passa sopra ciascuna (o toccala): una scheda ti dice cosa succede se la muovi, se \xE8 una mossa ottima, buona, debole o sbagliata, e quale sarebbe la migliore. Confermi tu la mossa con il pulsante."}]},en:{intro:"A dice-and-pawns board game, against the computer or two players on the same device.",rules:[{title:"The goal.",text:"The first to bring their four pawns into the four home squares wins."},{title:"The die.",text:"On your turn you roll the die and move a pawn forward by the number shown."},{title:"Leaving the base.",text:"With a 6 a pawn leaves th
